<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <radialGradient id="plasmaCore" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="25%" stop-color="#38bdf8"/>
      <stop offset="55%" stop-color="#818cf8"/>
      <stop offset="80%" stop-color="#c026d3"/>
      <stop offset="100%" stop-color="#4c0519" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="turbineRing" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="35%" stop-color="#1e293b"/>
      <stop offset="70%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="magnetGlow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
  </defs>

  <!-- Outer Turbine Ring -->
  <circle cx="400" cy="380" r="280" fill="url(#turbineRing)" stroke="#6366f1" stroke-width="4" stroke-opacity="0.6"/>
  <circle cx="400" cy="380" r="255" fill="#0b0a1a" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.4"/>

  <!-- Magnets -->
  <g fill="#1e293b" stroke="#475569" stroke-width="2">
    <rect x="385" y="115" width="30" height="60" rx="4" fill="url(#magnetGlow)"/>
    <rect x="385" y="585" width="30" height="60" rx="4" fill="url(#magnetGlow)"/>
    <rect x="135" y="365" width="60" height="30" rx="4" fill="url(#magnetGlow)"/>
    <rect x="605" y="365" width="60" height="30" rx="4" fill="url(#magnetGlow)"/>
  </g>

  <!-- Glowing Core -->
  <circle class="reactor-core-glow" cx="400" cy="380" r="130" fill="url(#plasmaCore)"/>

  <!-- Observation Gantry Platform & Engineers -->
  <g>
    <rect x="80" y="550" width="640" height="24" fill="#1e293b" stroke="#475569" stroke-width="2"/>
    <line x1="80" y1="505" x2="720" y2="505" stroke="#94a3b8" stroke-width="3"/>
    <!-- Engineer 1 -->
    <ellipse cx="280" cy="460" rx="9" ry="11" fill="#fed7aa"/>
    <path d="M270,471 L290,471 L295,550 L265,550 Z" fill="#ec4899"/>
    <!-- Engineer 2 -->
    <ellipse cx="500" cy="462" rx="9" ry="11" fill="#fed7aa"/>
    <path d="M490,473 L510,473 L514,550 L486,550 Z" fill="#38bdf8"/>
  </g>

  <!-- Foreground Mission Control Console -->
  <g>
    <polygon points="450,780 760,780 730,680 480,680" fill="#0f172a" stroke="#334155" stroke-width="2"/>
    <!-- Dual monitors -->
    <polygon points="490,670 590,650 590,590 490,610" fill="#1e1b4b" stroke="#38bdf8" stroke-width="2"/>
    <polygon points="610,650 710,670 710,610 610,590" fill="#1e1b4b" stroke="#ec4899" stroke-width="2"/>
    <!-- Seated operator -->
    <ellipse cx="550" cy="695" rx="8" ry="10" fill="#fed7aa"/>
    <path d="M540,705 L560,705 L565,760 L535,760 Z" fill="#64748b"/>
  </g>
</svg>