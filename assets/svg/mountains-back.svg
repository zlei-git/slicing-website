  <!-- Distant Mountain Ranges (Layer 1) -->
  <path d="M0,640 L160,560 L380,620 L620,510 L840,580 L1080,480 L1350,540 L1580,470 L1780,530 L1920,490 L1920,1080 L0,1080 Z" fill="url(#farPeaks)" opacity="0.65"/>
  
  <path d="M0,690 L220,600 L490,660 L780,560 L1020,630 L1260,530 L1520,610 L1760,540 L1920,590 L1920,1080 L0,1080 Z" fill="#2d1c44" opacity="0.8"/>
</svg>
