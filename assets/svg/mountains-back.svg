<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%" preserveAspectRatio="none">
  <defs>
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#120e28"/>
      <stop offset="25%" stop-color="#241945"/>
      <stop offset="55%" stop-color="#4e2a5f"/>
      <stop offset="78%" stop-color="#9d496a"/>
      <stop offset="92%" stop-color="#d97463"/>
      <stop offset="100%" stop-color="#f8a964"/>
    </linearGradient>
    <linearGradient id="sunGlow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff5cc" stop-opacity="0.9"/>
      <stop offset="35%" stop-color="#f8af4e" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#e11d48" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="farPeaks" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5a386c"/>
      <stop offset="60%" stop-color="#3b234f"/>
      <stop offset="100%" stop-color="#211438"/>
    </linearGradient>
