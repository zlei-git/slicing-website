<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 600" width="100%" height="100%">
  <defs>
    <linearGradient id="cloudWarm" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="60%" stop-color="#fed7aa" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#f472b6" stop-opacity="0.4"/>
    </linearGradient>
    <linearGradient id="cloudPurple" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e9d5ff" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#7e22ce" stop-opacity="0.2"/>
    </linearGradient>
  </defs>

  <!-- Left Cloud Bank -->
  <g class="cloud-bank-1">
    <path d="M-80,380 C-40,320 20,320 60,350 C100,300 180,300 220,340 C280,280 380,280 430,340 C480,300 560,310 590,360 C640,330 720,340 750,390 L-80,480 Z" fill="url(#cloudWarm)"/>
  </g>

  <!-- Central Cloud Drift -->
  <g class="cloud-bank-2">
    <path d="M780,280 C820,230 890,230 930,260 C980,210 1080,210 1130,250 C1190,190 1310,190 1370,250 C1430,220 1510,230 1550,280 L780,340 Z" fill="url(#cloudWarm)" opacity="0.85"/>
  </g>

  <!-- High Cirrus Wisps -->
  <g class="cloud-bank-3">
    <path d="M250,140 Q420,110 650,130 Q510,160 250,140 Z" fill="#fdf2f8" opacity="0.6"/>
    <path d="M1100,120 Q1350,90 1620,110 Q1420,140 1100,120 Z" fill="#fdf2f8" opacity="0.5"/>
  </g>
</svg>
