<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 900" width="100%" height="100%">
  <defs>
    <linearGradient id="moltenStream" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="30%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <radialGradient id="basinGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff8e7"/>
      <stop offset="30%" stop-color="#f59e0b"/>
      <stop offset="70%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#450a0a" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Industrial Scaffolding -->
  <g stroke="#334155" stroke-width="6" opacity="0.7">
    <line x1="80" y1="80" x2="620" y2="80"/>
    <line x1="80" y1="280" x2="620" y2="280"/>
    <line x1="80" y1="620" x2="620" y2="620"/>
    <line x1="80" y1="80" x2="260" y2="280"/>
    <line x1="260" y1="80" x2="80" y2="280"/>
    <line x1="260" y1="80" x2="440" y2="280"/>
    <line x1="440" y1="80" x2="260" y2="280"/>
    <line x1="440" y1="80" x2="620" y2="280"/>
    <line x1="620" y1="80" x2="440" y2="280"/>
  </g>

  <!-- Cauldrons / Crucibles -->
  <polygon points="150,220 250,220 230,290 170,290" fill="#334155" stroke="#475569" stroke-width="3"/>
  <ellipse cx="200" cy="220" rx="42" ry="10" fill="#f59e0b"/>

  <polygon points="300,200 400,200 380,270 320,270" fill="#334155" stroke="#475569" stroke-width="3"/>
  <ellipse cx="350" cy="200" rx="42" ry="10" fill="#f59e0b"/>

  <polygon points="450,220 550,220 530,290 470,290" fill="#334155" stroke="#475569" stroke-width="3"/>
  <ellipse cx="500" cy="220" rx="42" ry="10" fill="#f59e0b"/>

  <!-- 3 Continuous Molten Streams -->
  <rect x="194" y="300" width="12" height="380" rx="6" fill="url(#moltenStream)"/>
  <rect x="343" y="280" width="14" height="400" rx="7" fill="url(#moltenStream)"/>
  <rect x="494" y="300" width="12" height="380" rx="6" fill="url(#moltenStream)"/>

  <!-- Basins -->
  <ellipse cx="200" cy="680" rx="55" ry="18" fill="#1e293b"/>
  <circle cx="200" cy="675" r="30" fill="url(#basinGlow)" opacity="0.8"/>

  <ellipse cx="350" cy="680" rx="65" ry="20" fill="#1e293b"/>
  <circle cx="350" cy="675" r="36" fill="url(#basinGlow)" opacity="0.9"/>

  <ellipse cx="500" cy="680" rx="55" ry="18" fill="#1e293b"/>
  <circle cx="500" cy="675" r="30" fill="url(#basinGlow)" opacity="0.8"/>
</svg>