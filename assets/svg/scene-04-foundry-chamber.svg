<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <linearGradient id="foundry-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080516"/>
      <stop offset="50%" stop-color="#180b26"/>
      <stop offset="100%" stop-color="#0a0518"/>
    </linearGradient>

    <linearGradient id="molten-amber" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="15%" stop-color="#fef08a"/>
      <stop offset="45%" stop-color="#f59e0b"/>
      <stop offset="80%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#b91c1c"/>
    </linearGradient>

    <radialGradient id="crucible-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f97316" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#dc2626" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#080516" stop-opacity="0"/>
    </radialGradient>

    <filter id="molten-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background Chamber -->
  <rect width="1920" height="1080" fill="url(#foundry-bg)"/>

  <!-- Ambient Crucible Glow across Right Half -->
  <ellipse cx="1450" cy="540" rx="450" ry="400" fill="url(#crucible-glow)"/>

  <!-- Industrial Heavy Girders & Overhead Crane Tracks -->
  <g stroke="#261738" stroke-width="14" opacity="0.8">
    <line x1="0" y1="120" x2="1920" y2="120"/>
    <line x1="0" y1="240" x2="1920" y2="240"/>
    <line x1="1050" y1="0" x2="1050" y2="1080"/>
  </g>

  <!-- Overhead Crane Trolley -->
  <rect x="1250" y="90" width="380" height="45" fill="#140b20" stroke="#f59e0b" stroke-width="3"/>
  <line x1="1340" y1="135" x2="1340" y2="280" stroke="#4a3560" stroke-width="4"/>
  <line x1="1540" y1="135" x2="1540" y2="280" stroke="#4a3560" stroke-width="4"/>

  <!-- ==============================================
       RIGHT: 3 VERTICAL MOLTEN ORANGE CONDUITS
       ============================================== -->
  <g id="molten-conduits">
    <!-- Stream 1 (Leftmost of the three) -->
    <rect x="1220" y="240" width="45" height="660" fill="url(#molten-amber)" rx="8" filter="url(#molten-glow)"/>
    <line x1="1242" y1="240" x2="1242" y2="900" stroke="#ffffff" stroke-width="6" opacity="0.8"/>
    <!-- Base Crucible Vat -->
    <ellipse cx="1242" cy="920" rx="60" ry="24" fill="#ea580c" filter="url(#molten-glow)"/>
    <rect x="1200" y="920" width="85" height="100" fill="#180e28" stroke="#f97316" stroke-width="3" rx="4"/>

    <!-- Stream 2 (Center) -->
    <rect x="1420" y="160" width="55" height="740" fill="url(#molten-amber)" rx="8" filter="url(#molten-glow)"/>
    <line x1="1447" y1="160" x2="1447" y2="900" stroke="#ffffff" stroke-width="8" opacity="0.9"/>
    <!-- Base Crucible Vat -->
    <ellipse cx="1447" cy="920" rx="75" ry="28" fill="#ea580c" filter="url(#molten-glow)"/>
    <rect x="1395" y="920" width="105" height="120" fill="#180e28" stroke="#f97316" stroke-width="4" rx="4"/>

    <!-- Stream 3 (Right) -->
    <rect x="1640" y="240" width="45" height="660" fill="url(#molten-amber)" rx="8" filter="url(#molten-glow)"/>
    <line x1="1662" y1="240" x2="1662" y2="900" stroke="#ffffff" stroke-width="6" opacity="0.8"/>
    <!-- Base Crucible Vat -->
    <ellipse cx="1662" cy="920" rx="60" ry="24" fill="#ea580c" filter="url(#molten-glow)"/>
    <rect x="1620" y="920" width="85" height="100" fill="#180e28" stroke="#f97316" stroke-width="3" rx="4"/>
  </g>

  <!-- Scaffolding Walkway Crossing in Front -->
  <rect x="1140" y="620" width="650" height="25" fill="#1c1130" stroke="#4a3560" stroke-width="3"/>
  <line x1="1140" y1="570" x2="1790" y2="570" stroke="#f59e0b" stroke-width="3" opacity="0.85"/>
  <line x1="1160" y1="570" x2="1160" y2="620" stroke="#3a2750" stroke-width="2" />
  <line x1="1202" y1="570" x2="1202" y2="620" stroke="#3a2750" stroke-width="2" />
  <line x1="1244" y1="570" x2="1244" y2="620" stroke="#3a2750" stroke-width="2" />
  <line x1="1286" y1="570" x2="1286" y2="620" stroke="#3a2750" stroke-width="2" />
  <line x1="1328" y1="570" x2="1328" y2="620" stroke="#3a2750" stroke-width="2" />
  <line x1="1370" y1="570" x2="1370" y2="620" stroke="#3a2750" stroke-width="2" />
  <line x1="1412" y1="570" x2="1412" y2="620" stroke="#3a2750" stroke-width="2" />
  <line x1="1454" y1="570" x2="1454" y2="620" stroke="#3a2750" stroke-width="2" />
  <line x1="1496" y1="570" x2="1496" y2="620" stroke="#3a2750" stroke-width="2" />
  <line x1="1538" y1="570" x2="1538" y2="620" stroke="#3a2750" stroke-width="2" />
  <line x1="1580" y1="570" x2="1580" y2="620" stroke="#3a2750" stroke-width="2" />
  <line x1="1622" y1="570" x2="1622" y2="620" stroke="#3a2750" stroke-width="2" />
  <line x1="1664" y1="570" x2="1664" y2="620" stroke="#3a2750" stroke-width="2" />
  <line x1="1706" y1="570" x2="1706" y2="620" stroke="#3a2750" stroke-width="2" />
  <line x1="1748" y1="570" x2="1748" y2="620" stroke="#3a2750" stroke-width="2" />

  <!-- Foundry Worker Silhouette on Catwalk -->
  <g fill="#080516" transform="translate(1320, 500)">
    <ellipse cx="16" cy="12" rx="9" ry="10"/>
    <path d="M4,26 Q16,20 28,26 L32,70 L0,70 Z"/>
    <!-- Protective Face Visor -->
    <path d="M18,10 Q26,12 24,18" stroke="#f59e0b" stroke-width="3" fill="none" filter="url(#molten-glow)"/>
  </g>

  <!-- Left Platform Console with Engineer -->
  <g id="foundry-console" transform="translate(80, 780)">
    <rect x="0" y="60" width="340" height="180" fill="#120a22" stroke="#36224e" stroke-width="3" rx="4"/>
    <rect x="40" y="20" width="60" height="35" fill="#f59e0b" opacity="0.9" rx="2" filter="url(#molten-glow)"/>
    <rect x="120" y="20" width="60" height="35" fill="#38bdf8" opacity="0.85" rx="2"/>
    <!-- Silhouette Operator -->
    <ellipse cx="90" cy="30" rx="9" ry="10" fill="#080516"/>
    <path d="M78,44 Q90,38 102,44 L106,120 L74,120 Z" fill="#080516"/>
  </g>
</svg>