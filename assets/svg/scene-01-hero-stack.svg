<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <linearGradient id="h-bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080820"/>
      <stop offset="45%" stop-color="#100b32"/>
      <stop offset="75%" stop-color="#171044"/>
      <stop offset="100%" stop-color="#060616"/>
    </linearGradient>

    <linearGradient id="h-beam" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.9"/>
      <stop offset="25%" stop-color="#818cf8" stop-opacity="0.8"/>
      <stop offset="70%" stop-color="#c084fc" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#f472b6" stop-opacity="0.85"/>
    </linearGradient>

    <linearGradient id="glass-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25"/>
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.28"/>
    </linearGradient>

    <linearGradient id="room-amber" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#f97316" stop-opacity="0.15"/>
    </linearGradient>

    <radialGradient id="h-core-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.45"/>
      <stop offset="60%" stop-color="#818cf8" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#080820" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="floor-magenta" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#d946ef" stop-opacity="0.35"/>
      <stop offset="70%" stop-color="#a855f7" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#080820" stop-opacity="0"/>
    </radialGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background Ambience -->
  <rect width="1920" height="1080" fill="url(#h-bg-grad)"/>

  <!-- Distant Background City Silhouettes -->
  <g opacity="0.35">
    <polygon points="120,680 180,680 180,420 260,420 260,680" fill="#130e38"/>
    <polygon points="300,700 380,700 380,360 440,360 440,700" fill="#1a134a"/>
    <polygon points="460,720 540,720 540,480 600,480 600,720" fill="#130e38"/>
  </g>

  <!-- Magenta Floor Reflection -->
  <ellipse cx="960" cy="1000" rx="750" ry="160" fill="url(#floor-magenta)"/>

  <!-- ==============================================
       CENTER: VERTICAL WATERFALL & LIGHT COLUMN
       ============================================== -->
  <!-- Ambient Core Glow -->
  <ellipse cx="940" cy="540" rx="220" ry="500" fill="url(#h-core-glow)"/>

  <!-- Outer Light Shroud -->
  <polygon points="900,0 980,0 1020,1080 860,1080" fill="url(#h-beam)" opacity="0.45"/>

  <!-- Core Waterfall Stream -->
  <polygon points="925,0 955,0 970,1080 910,1080" fill="#e0f2fe" opacity="0.8" filter="url(#glow)"/>

  <!-- Cascading Energy Ribbons -->
  <path d="M930,0 Q910,250 945,500 T925,850 L935,1080" stroke="#38bdf8" stroke-width="3" fill="none" opacity="0.75"/>
  <path d="M950,0 Q970,300 935,600 T955,950 L945,1080" stroke="#f472b6" stroke-width="2.5" fill="none" opacity="0.7"/>

  <!-- Falling Light Particles -->
  <g fill="#ffffff" opacity="0.85">
    <circle cx="935" cy="120" r="2.5" filter="url(#glow)"/>
    <circle cx="948" cy="240" r="3"/>
    <circle cx="928" cy="380" r="2"/>
    <circle cx="952" cy="510" r="3.5" filter="url(#glow)"/>
    <circle cx="938" cy="670" r="2.5"/>
    <circle cx="946" cy="820" r="3"/>
    <circle cx="930" cy="940" r="2"/>
  </g>

  <!-- ==============================================
       RIGHT THIRD: 3-STORY STACKED GLASS ARCHITECTURE
       ============================================== -->
  <g id="stacked-architecture">
    <!-- Outer Building Skeleton -->
    <rect x="1140" y="140" width="700" height="880" fill="#0d092b" stroke="#3b2d71" stroke-width="3" rx="8"/>

    <!-- LEVEL 3 (TOP FLOOR): Observation Deck -->
    <g id="floor-3">
      <rect x="1170" y="170" width="640" height="230" fill="url(#glass-grad)" stroke="#4c3b8a" stroke-width="2" rx="4"/>
      <rect x="1170" y="170" width="640" height="230" fill="url(#room-amber)" opacity="0.6"/>
      
      <!-- Architectural Glass Mullions -->
      <line x1="1330" y1="170" x2="1330" y2="400" stroke="#38bdf8" stroke-width="1.5" opacity="0.5"/>
      <line x1="1490" y1="170" x2="1490" y2="400" stroke="#38bdf8" stroke-width="1.5" opacity="0.5"/>
      <line x1="1650" y1="170" x2="1650" y2="400" stroke="#38bdf8" stroke-width="1.5" opacity="0.5"/>

      <!-- Ceiling Light Fixtures -->
      <line x1="1200" y1="180" x2="1780" y2="180" stroke="#ffffff" stroke-width="2" opacity="0.6" filter="url(#glow)"/>

      <!-- Silhouette Researchers Standing on Level 3 -->
      <g class="scene-living-characters">
        <!-- Living Researcher 1: Pacing Balcony Observer -->
        <g class="char-pacing-researcher" transform="translate(1380, 290)">
          <!-- Head -->
          <ellipse class="char-head-tilt" cx="20" cy="20" rx="8.5" ry="9.5" fill="#0c0828"/>
          <!-- Body / Lab Coat -->
          <path class="char-body-sway" d="M10,36 Q20,31 30,36 L34,102 L6,102 Z" fill="#140d3a"/>
          <!-- Flapping Coat Tail in Updraft -->
          <path class="char-coat-tail" d="M6,80 Q2,95 0,104 L14,102 Z" fill="#1d134d" opacity="0.85"/>
          <!-- Arm holding glowing data pad -->
          <g class="char-arm-datapad">
            <line x1="12" y1="46" x2="24" y2="60" stroke="#0c0828" stroke-width="4" stroke-linecap="round"/>
            <rect x="20" y="55" width="16" height="11" fill="#38bdf8" rx="1.5" filter="url(#glow)"/>
          </g>
        </g>

        <!-- Living Researcher 2: Senior Analyst Pointing at Light Column -->
        <g class="char-pointing-analyst" transform="translate(1440, 288)">
          <ellipse class="char-head-nod" cx="15" cy="20" rx="8.5" ry="9.5" fill="#0c0828"/>
          <path d="M5,35 L25,35 L28,102 L2,102 Z" fill="#140d3a"/>
          <!-- Animated Pointing Arm -->
          <g class="char-arm-gesture">
            <line x1="20" y1="48" x2="48" y2="28" stroke="#0c0828" stroke-width="4.5" stroke-linecap="round"/>
            <circle cx="48" cy="28" r="3" fill="#f472b6" filter="url(#glow)"/>
          </g>
        </g>
      </g>
      <!-- Glass Handrail -->
      <line x1="1170" y1="365" x2="1810" y2="365" stroke="#38bdf8" stroke-width="2" opacity="0.7"/>
    </g>

    <!-- LEVEL 2 (MID FLOOR): Research Laboratory -->
    <g id="floor-2">
      <rect x="1170" y="440" width="640" height="250" fill="url(#glass-grad)" stroke="#4c3b8a" stroke-width="2" rx="4"/>
      
      <!-- Cyan Workstation Glow -->
      <rect x="1220" y="520" width="180" height="140" fill="#38bdf8" opacity="0.08" rx="4"/>
      <rect x="1560" y="520" width="200" height="140" fill="#d946ef" opacity="0.08" rx="4"/>

      <!-- Mullions -->
      <line x1="1330" y1="440" x2="1330" y2="690" stroke="#818cf8" stroke-width="1.5" opacity="0.4"/>
      <line x1="1490" y1="440" x2="1490" y2="690" stroke="#818cf8" stroke-width="1.5" opacity="0.4"/>
      <line x1="1650" y1="440" x2="1650" y2="690" stroke="#818cf8" stroke-width="1.5" opacity="0.4"/>

      <!-- Tech Screens Glow inside -->
      <rect x="1270" y="550" width="36" height="22" fill="#38bdf8" opacity="0.85" rx="2" filter="url(#glow)"/>
      <rect x="1312" y="550" width="36" height="22" fill="#38bdf8" opacity="0.85" rx="2" filter="url(#glow)"/>
      <rect x="1600" y="545" width="48" height="28" fill="#f472b6" opacity="0.8" rx="2" filter="url(#glow)"/>

      <!-- Researcher Sitting at Screen -->
      <g fill="#080820" opacity="0.92">
        <ellipse cx="1295" cy="540" rx="9" ry="10"/>
        <path d="M1284,555 Q1295,550 1306,555 L1310,670 L1280,670 Z"/>
        <!-- Chair -->
        <rect x="1285" y="570" width="22" height="100" fill="#130e38"/>
      </g>
    </g>

    <!-- LEVEL 1 (GROUND FLOOR): Structural Foundations & Power Conduits -->
    <g id="floor-1">
      <rect x="1170" y="730" width="640" height="260" fill="#09061c" stroke="#3b2d71" stroke-width="2" rx="4"/>
      
      <!-- Power Conduit Tubes -->
      <path d="M1220,730 L1220,990" stroke="#f59e0b" stroke-width="6" opacity="0.75" filter="url(#glow)"/>
      <path d="M1240,730 L1240,990" stroke="#d946ef" stroke-width="4" opacity="0.7"/>
      <path d="M1740,730 L1740,990" stroke="#38bdf8" stroke-width="6" opacity="0.8" filter="url(#glow)"/>

      <!-- Structural Trusses (X-bracing) -->
      <line x1="1300" y1="740" x2="1480" y2="980" stroke="#251b54" stroke-width="4"/>
      <line x1="1480" y1="740" x2="1300" y2="980" stroke="#251b54" stroke-width="4"/>
      <line x1="1500" y1="740" x2="1680" y2="980" stroke="#251b54" stroke-width="4"/>
      <line x1="1680" y1="740" x2="1500" y2="980" stroke="#251b54" stroke-width="4"/>
    </g>
  </g>

  <!-- ==============================================
       BOTTOM LEFT: ENGINEER WORKSTATION & CONSOLE
       ============================================== -->
  <g id="hero-workstation" transform="translate(60, 720)">
    <!-- Platform Base -->
    <polygon points="0,280 480,280 430,340 0,340" fill="#120c38" stroke="#332468" stroke-width="2"/>
    
    <!-- Desk Structure -->
    <rect x="160" y="160" width="180" height="120" fill="#1a124c" stroke="#433182" stroke-width="2" rx="4"/>

    <!-- Glowing Dual Monitors -->
    <rect x="180" y="110" width="65" height="42" fill="#38bdf8" opacity="0.9" rx="2" filter="url(#glow)"/>
    <rect x="185" y="115" width="55" height="32" fill="#080820"/>
    <!-- Code Lines on Monitor 1 -->
    <line x1="190" y1="122" x2="230" y2="122" stroke="#38bdf8" stroke-width="1.5"/>
    <line x1="190" y1="128" x2="220" y2="128" stroke="#38bdf8" stroke-width="1.5"/>
    <line x1="190" y1="134" x2="235" y2="134" stroke="#f472b6" stroke-width="1.5"/>
    <line x1="190" y1="140" x2="215" y2="140" stroke="#38bdf8" stroke-width="1.5"/>

    <rect x="255" y="110" width="65" height="42" fill="#f59e0b" opacity="0.85" rx="2" filter="url(#glow)"/>
    <rect x="260" y="115" width="55" height="32" fill="#080820"/>
    <!-- Graph on Monitor 2 -->
    <polyline points="265,140 275,130 285,135 295,122 305,125" fill="none" stroke="#f59e0b" stroke-width="1.8"/>

    <!-- Living Lead Systems Engineer at Workstation -->
    <g class="char-typing-engineer">
      <!-- Head Scanning Between Screens -->
      <ellipse class="char-engineer-head-scan" cx="235" cy="180" rx="10.5" ry="12.5" fill="#080820"/>
      <!-- Torso with subtle breathing -->
      <path class="char-engineer-breathing" d="M220,195 Q235,188 250,195 L255,280 L215,280 Z" fill="#080820"/>
      <!-- Actively Typing Left Arm -->
      <g class="char-engineer-arm-left">
        <line x1="225" y1="208" x2="210" y2="230" stroke="#080820" stroke-width="4.5" stroke-linecap="round"/>
        <line x1="210" y1="230" x2="198" y2="228" stroke="#080820" stroke-width="3.5" stroke-linecap="round"/>
      </g>
      <!-- Actively Typing Right Arm -->
      <g class="char-engineer-arm-right">
        <line x1="242" y1="208" x2="260" y2="232" stroke="#080820" stroke-width="4.5" stroke-linecap="round"/>
        <line x1="260" y1="232" x2="272" y2="229" stroke="#080820" stroke-width="3.5" stroke-linecap="round"/>
      </g>
      <!-- Keyboard Activity Glow Flare -->
      <ellipse class="char-keyboard-flare" cx="235" cy="235" rx="35" ry="8" fill="#38bdf8" opacity="0.35" filter="url(#glow)"/>
    </g>
    
    <!-- Floor Ambient Glow -->
    <ellipse cx="240" cy="285" rx="80" ry="14" fill="#38bdf8" opacity="0.2" filter="url(#glow)"/>
  </g>

  <!-- Foreground Railing Spanning Bottom -->
  <line x1="0" y1="1040" x2="1920" y2="1040" stroke="#2d1f60" stroke-width="3" opacity="0.6"/>
  <line x1="0" y1="1070" x2="1920" y2="1070" stroke="#1d1440" stroke-width="4" opacity="0.8"/>
  <line x1="300" y1="1040" x2="300" y2="1080" stroke="#2d1f60" stroke-width="3"/>
  <line x1="700" y1="1040" x2="700" y2="1080" stroke="#2d1f60" stroke-width="3"/>
  <line x1="1100" y1="1040" x2="1100" y2="1080" stroke="#2d1f60" stroke-width="3"/>
  <line x1="1500" y1="1040" x2="1500" y2="1080" stroke="#2d1f60" stroke-width="3"/>
</svg>